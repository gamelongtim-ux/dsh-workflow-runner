name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build vendored engine + verify vendor integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      # The vendored ZCode engine is built with the repo's own typescript, so a
      # build failure here means the plugin would ship a broken dist.
      - name: Build vendored @zcode/dynamic-workflow
        run: npm run build

      # Guards against someone editing the vendored upstream source by hand.
      # The manifest is the contract: packages/dynamic-workflow must stay
      # byte-identical to zai-org/ZCode.
      - name: Verify vendored tree matches its manifest
        run: npm run verify:vendor

      - name: Smoke: the engine must load and expose its public API
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const m = await import('./packages/dynamic-workflow/dist/index.js');
            const required = [
              'compileWorkflowScript', 'createWorkflowProgram', 'analyzeWorkflowScript',
              'lowerWorkflow', 'synthesizeAskSchemas', 'buildAskSpecs',
              'WorkflowEngine', 'FACADE_DTS', 'FACADE_FILE_NAME',
            ];
            const missing = required.filter((k) => !(k in m));
            if (missing.length) { console.error('missing exports:', missing); process.exit(1); }
            console.log('engine exports ok:', required.length);
          "

      # The real end-to-end proof: a workflow script is compiled, analysed,
      # lowered, executed in the harness child process, and settled — with a
      # stub model and a stub world, so CI needs no network and no LLM.
      - name: Smoke: a Dynamic Workflow runs end to end
        run: node scripts/dwf-smoke.mjs

      # The same, but through dsh's own runtime: the run is registered in the
      # runs map with the same state shape, and the sandbox fences are
      # checked (a path escape and a symlink out must both be refused).
      - name: Smoke: the engine path inside dsh's runtime
        run: node scripts/dwf-runtime-smoke.mjs

      # The legacy child-process path must keep working: v0.13.0 changed the
      # path fence and made the model call injectable, and both touch it.
      - name: Smoke: the legacy child-process path
        run: node scripts/legacy-smoke.mjs

      # The compile report the engine endpoints serve: diagnostics, the four
      # graphs, the ask sites and the lowered body.
      - name: Check: the compile report
        run: node scripts/dwf-compile-check.mjs

  syntax-check:
    name: node --check (lib + public + samples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # The plugin ships prebuilt ESM for the vendored engine; there is
          # nothing to install for the plugin's own sources, and the vendored
          # tree is covered by the `build` job above.

      - name: Syntax check every .js and .mjs file
        run: |
          set -e
          shopt -s globstar nullglob
          ok=0
          fail=0
          for f in lib/**/*.js lib/**/*.mjs public/**/*.js public/**/*.mjs samples/**/*.js samples/**/*.mjs scripts/**/*.mjs; do
            case "$f" in node_modules/*) continue;; esac
            if node --check "$f" 2>/tmp/err; then
              ok=$((ok + 1))
            else
              echo "::error file=$f::$(cat /tmp/err)"
              fail=$((fail + 1))
            fi
          done
          echo "checked=$ok failed=$fail"
          if [ "$fail" -ne 0 ]; then exit 1; fi
